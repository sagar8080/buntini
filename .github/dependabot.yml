version: 2
# One weekly PR for every ecosystem: main requires each PR to be up to date
# before it merges, so separate PRs each need their own CI run.
# Security updates still arrive as their own PRs as soon as they're published.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: cargo
    directory: /src-tauri
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: pip
    directory: /worker
    patterns: ["*"]
    multi-ecosystem-group: dependencies
