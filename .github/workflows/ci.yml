name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Tests
    # macOS 26 includes the SDK needed to build Foundation Models contracts.
    runs-on: macos-26
    # Cold, with no cache to restore, the checks took 25 minutes on main and timed out at 30 on
    # the v0.3.0 tag.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      # A release tag sits on a commit main has already tested. When CI passed on main for this
      # exact commit, that run is the tag's tests; otherwise (the tag came first) they run here.
      - name: Find this commit's passing run on main
        id: tested
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          runs=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$RELEASE_COMMIT&branch=main&event=push&status=success" --jq '.total_count')
          if [ "${runs:-0}" -gt 0 ]; then
            echo "CI already passed on main for $RELEASE_COMMIT."
            echo "passed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.tested.outputs.passed != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.tested.outputs.passed != 'true'
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.tested.outputs.passed != 'true'
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        if: steps.tested.outputs.passed != 'true'
        with:
          toolchain: '1.99.1'
      # Saved from main only: pull requests and tags restore main's, and a pull request's cache,
      # which nothing else can read, doesn't push main's out.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: steps.tested.outputs.passed != 'true'
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The Swift helpers' builds (native audio, about 4.5 minutes cold, and the surface checks),
      # kept per Swift version and sources, and saved from main only like the Rust cache.
      - name: Note the Swift version
        id: swift
        if: steps.tested.outputs.passed != 'true'
        run: echo "version=$(swift --version 2>&1 | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: swift-cache
        if: steps.tested.outputs.passed != 'true'
        with:
          path: |
            native/audio/.build
            native/surface-lab/.build
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift.outputs.version }}-${{ hashFiles('native/audio/Package.*', 'native/audio/Sources/**', 'native/surface/Package.swift', 'native/surface/Sources/**', 'native/surface-lab/Package.swift', 'native/surface-lab/Sources/**') }}
          restore-keys: swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift.outputs.version }}-
      - run: npm ci
        if: steps.tested.outputs.passed != 'true'
      # The memory search model is bundled; fetch it at its pinned revision and hashes.
      - run: ./scripts/fetch-models.sh
        if: steps.tested.outputs.passed != 'true'
      - run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml
        if: steps.tested.outputs.passed != 'true'
      - run: ./scripts/check.sh
        if: steps.tested.outputs.passed != 'true'
        env:
          BUNTINI_REQUIRE_FM: '1'
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.tested.outputs.passed != 'true' && github.ref == 'refs/heads/main' && steps.swift-cache.outputs.cache-hit != 'true'
        with:
          path: |
            native/audio/.build
            native/surface-lab/.build
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: '1.99.1'
      - name: Audit npm, including the build toolchain
        # Fails on any high or critical advisory but those reviewed in
        # scripts/npm-audit-exceptions.json, each only until its date or a change to it.
        run: node scripts/npm_audit.mjs
      - name: Audit Rust crates
        run: |
          cargo install cargo-audit --version 0.22.1 --locked
          cargo audit --file src-tauri/Cargo.lock

  python-audit:
    name: Optional MLX and voice dependency audit
    # Resolve on the shipping platform so arm64/macOS markers aren't skipped.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'pip-audit==2.10.1'
      - run: python3 -m pip_audit -r worker/requirements.txt -r worker/requirements-vad.txt -r worker/requirements-voice.txt
      # What one-click local setup really installs.
      - run: python3 -m pip_audit -r worker/requirements-local.lock --require-hashes --disable-pip

  build:
    name: Development bundle
    needs: check
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: '1.99.1'
      # The same release-profile build as the signed bundle: one cache for both, saved from main,
      # so a release tag starts from main's last build instead of from nothing.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-bundle
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      # The memory search model is bundled; fetch it at its pinned revision and hashes.
      - run: ./scripts/fetch-models.sh
      - name: Build an ad-hoc development app
        run: npm run tauri -- build --ci --bundles app -- --locked
        env:
          BUNTINI_REQUIRE_FM: '1'
      - name: Archive development app
        run: ditto -c -k --keepParent src-tauri/target/release/bundle/macos/Buntini.app Buntini-development-macOS-arm64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Buntini-development-macOS-arm64
          path: Buntini-development-macOS-arm64.zip
          retention-days: 14
          if-no-files-found: error

  release-build:
    name: Signed and notarized release bundle
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, audit, python-audit]
    runs-on: macos-26
    timeout-minutes: 90
    # Configure required reviewers and protected tag rules for this environment.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-bundle
          save-if: false
      - run: npm ci
      # The memory search model is bundled; fetch it at its pinned revision and hashes.
      - run: ./scripts/fetch-models.sh
      - name: Require matching versions, Developer ID and notarization
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 scripts/release_preflight.py --tag "$RELEASE_TAG" --require-signing
      - name: Build and notarize
        env:
          BUNTINI_REQUIRE_FM: '1'
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          umask 077
          config_dir=$(mktemp -d "$RUNNER_TEMP/buntini-release.XXXXXX")
          config="$config_dir/release.json"
          trap 'rm -f "$config" "$config_dir/notarization.json"; rmdir "$config_dir"' EXIT
          python3 -c 'import json, os, sys; json.dump({"bundle": {"macOS": {"signingIdentity": os.environ["APPLE_SIGNING_IDENTITY"], "hardenedRuntime": True}}}, open(sys.argv[1], "w"))' "$config"
          npm run tauri -- build --ci --config "$config" --bundles app,dmg -- --locked
          # Tauri notarizes/staples the app and signs the DMG. Submit the final
          # disk image separately so the downloadable container is stapled too.
          images=(src-tauri/target/release/bundle/dmg/*.dmg)
          test "${#images[@]}" -eq 1
          xcrun notarytool submit "${images[0]}" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --output-format json > "$config_dir/notarization.json"
          python3 scripts/release_notary_result.py "$config_dir/notarization.json"
          xcrun stapler staple "${images[0]}"
      - name: Verify and collect final distribution artifacts
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist-release
          bundle=src-tauri/target/release/bundle
          images=("$bundle"/dmg/*.dmg)
          test "${#images[@]}" -eq 1
          sh scripts/verify-release.sh "$bundle/macos/Buntini.app" "${images[0]}"
          ditto -c -k --keepParent "$bundle/macos/Buntini.app" dist-release/Buntini-macOS-arm64.zip
          cp "${images[0]}" dist-release/Buntini-macOS-arm64.dmg
          python3 -c 'import json, os; json.dump({"tag": os.environ["RELEASE_TAG"], "commit": os.environ["RELEASE_COMMIT"], "signing": "Developer ID Application", "notarization": "staple and Gatekeeper verified"}, open("dist-release/BUILD-INFO.json", "w"), indent=2)'
          (cd dist-release && shasum -a 256 Buntini-macOS-arm64.zip Buntini-macOS-arm64.dmg BUILD-INFO.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Buntini-macOS-arm64
          path: dist-release/
          retention-days: 30
          if-no-files-found: error

  release:
    name: Prepare draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Buntini-macOS-arm64
          path: dist-release
      - name: Verify archive checksums
        working-directory: dist-release
        run: sha256sum --check SHA256SUMS.txt
      - name: Create a draft for final device acceptance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          case "$RELEASE_TAG" in *-*) prerelease=(--prerelease);; esac
          gh release create "$RELEASE_TAG" dist-release/* --draft --verify-tag --generate-notes --title "$RELEASE_TAG" "${prerelease[@]}"
