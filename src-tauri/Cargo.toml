[package]
name = "buntini"
version = "0.2.0"
description = "A private, local-first desktop companion"
authors = ["Buntini"]
edition = "2021"
license = "MIT"
rust-version = "1.95"

[lib]
name = "buntini_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros", "net"] }
# Sign in with ChatGPT: PKCE (SHA-256, base64url) and random state, nonce and verifier.
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.40.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream", "form", "query"] }
futures-util = "0.3"
walkdir = "2.5"
scraper = "0.29"
libc = "0.2"
rfd = "0.17.2"
rusqlite = { version = "0.41", features = ["bundled"] }
objc2-application-services = "0.3.2"
objc2-core-foundation = "0.3.2"
candle-core = { version = "0.11.0", features = ["accelerate"] }
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWindow", "NSColor", "NSApplication", "NSScreen", "NSWorkspace", "NSRunningApplication", "libc"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSError", "NSArray", "NSDictionary", "NSValue"] }
objc2-user-notifications = { version = "0.3.2", features = ["block2"] }
block2 = "0.6"

[dev-dependencies]
tempfile = "3"
