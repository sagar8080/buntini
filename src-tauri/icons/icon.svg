<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Buntini's app icon: the ginger tabby from the desktop pet (src/Cat.tsx) on a
       twilight tile, drawn on Apple's 1024 icon grid (824 tile, soft shadow). -->
  <defs>
    <linearGradient id="tile" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B6FA6"/>
      <stop offset="1" stop-color="#2C3558"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="600" r="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6AA5E" stop-opacity=".32"/>
      <stop offset="1" stop-color="#F6AA5E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coat" x1="90" y1="56" x2="90" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8B46C"/>
      <stop offset=".6" stop-color="#F6AA5E"/>
      <stop offset="1" stop-color="#E2843D"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#141833" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <path d="M285 100H739C841 100 924 183 924 285V300C800 240 640 214 512 214C384 214 224 240 100 300V285C100 183 183 100 285 100Z" fill="#fff" fill-opacity=".07"/>

